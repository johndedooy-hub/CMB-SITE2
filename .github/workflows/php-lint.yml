name: PHP-syntaxcontrole
on:
  push:
    branches: [main]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Controleer PHP
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
